name: piano
description: "Accessible, libre piano keyboard."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: 3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_soloud: 4.0.13
  intl: 0.20.2
  shared_preferences: 2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/samples/
